# English -> Tamil video dubbing configuration.
# Every value can be overridden from the CLI or the web UI.

workspace: workspace        # temporary files for each job
output_dir: output          # finished videos, subtitles and transcripts
keep_temp: false            # keep intermediate files in the workspace

download:
  # yt-dlp format selector. Prefers H.264 (avc1); other codecs are re-encoded
  # to H.264 when merging. Local files skip this step.
  format: "bestvideo[vcodec^=avc1][height<=1080]+bestaudio/bestvideo[height<=1080]+bestaudio/best"

transcription:
  model_size: small         # tiny | base | small | medium | large-v3
  device: auto              # auto | cpu | cuda
  compute_type: auto        # auto | int8 | float16 | float32
  language: en
  vad_filter: true          # skip silence for cleaner segment timing

translation:
  engine: google            # google (online) | nllb (offline, needs optional deps)
  source: en
  target: ta
  nllb_model: facebook/nllb-200-distilled-600M

tts:
  engine: edge
  voice: ta-IN-PallaviNeural  # ta-IN-ValluvarNeural for a male voice
  rate: "+0%"
  pitch: "+0Hz"
  concurrency: 4

sync:
  sample_rate: 44100
  max_speedup: 1.6          # Tamil is usually longer than English; speed up at most this much
  gap: 0.1                  # seconds of silence kept between clips; long clips push later ones back

merge:
  keep_original_audio: false
  original_volume: 0.08     # background level when keep_original_audio is true
  dubbed_volume: 1.0
  subtitles: false          # embed Tamil subtitles as a soft track
